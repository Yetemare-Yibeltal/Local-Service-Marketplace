openapi: 3.0.0
info:
  title: Local Service Provider Marketplace API
  description: |
    RESTful API for connecting customers with local service professionals in Ethiopia.
    
    This API powers the Local Service Provider Marketplace platform, enabling users to find,
    book, and manage services from verified professionals.
    
    ## Features
    - User authentication & authorization
    - Provider registration & verification
    - Service discovery & booking
    - Review & rating system
    - Payment processing
    - Real-time notifications
    - Admin management
    - Analytics & reporting
  version: 1.0.0
  contact:
    name: API Support
    email: support@marketplace.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.marketplace.com/api/v1
    description: Production server
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://staging-api.marketplace.com/api/v1
    description: Staging server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Users
    description: User management endpoints
  - name: Providers
    description: Provider management endpoints
  - name: Services
    description: Service management endpoints
  - name: Bookings
    description: Booking management endpoints
  - name: Reviews
    description: Review management endpoints
  - name: Categories
    description: Category management endpoints
  - name: Search
    description: Search and discovery endpoints
  - name: Notifications
    description: Notification management endpoints
  - name: Payments
    description: Payment processing endpoints
  - name: Analytics
    description: Analytics and reporting endpoints
  - name: Admin
    description: Administrative endpoints
  - name: Webhooks
    description: Webhook handling endpoints

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here. Example: Bearer your-token

  schemas:
    # ============================================================
    # COMMON SCHEMAS
    # ============================================================
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
          nullable: true
        errors:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        statusCode:
          type: integer
          example: 200

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
        errors:
          type: array
          items:
            type: string
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /api/v1/users

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalItems:
              type: integer
              example: 100
            totalPages:
              type: integer
              example: 10
            hasNext:
              type: boolean
              example: true
            hasPrev:
              type: boolean
              example: false

    # ============================================================
    # USER SCHEMAS
    # ============================================================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, PROVIDER, ADMIN]
        profileImage:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        isEmailVerified:
          type: boolean
        isPhoneVerified:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - email
        - phone
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, PROVIDER]
          default: CUSTOMER

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    # ============================================================
    # PROVIDER SCHEMAS
    # ============================================================
    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        businessName:
          type: string
        businessLogo:
          type: string
          nullable: true
        description:
          type: string
        category:
          type: string
        subCategory:
          type: string
          nullable: true
        yearsExperience:
          type: integer
        hourlyRate:
          type: number
          nullable: true
        isAvailable:
          type: boolean
        isVerified:
          type: boolean
        averageRating:
          type: number
        totalReviews:
          type: integer
        address:
          type: string
        city:
          type: string
        locationLat:
          type: number
        locationLng:
          type: number
        completedJobs:
          type: integer
        responseTime:
          type: integer
          nullable: true
        isFeatured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priceType:
          type: string
          enum: [FIXED, HOURLY]
        price:
          type: number
        discountPrice:
          type: number
          nullable: true
        estimatedDurationMinutes:
          type: integer
          nullable: true
        category:
          type: string
        subCategory:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    # ============================================================
    # BOOKING SCHEMAS
    # ============================================================
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingNumber:
          type: string
        customerId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED]
        scheduledDate:
          type: string
          format: date-time
        address:
          type: string
        specialNotes:
          type: string
          nullable: true
        totalPrice:
          type: number
        depositAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ============================================================
    # REVIEW SCHEMAS
    # ============================================================
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        images:
          type: array
          items:
            type: string
        isPublic:
          type: boolean
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ============================================================
    # CATEGORY SCHEMAS
    # ============================================================
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAm:
          type: string
          nullable: true
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        displayOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryTree:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameAm:
          type: string
          nullable: true
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        displayOrder:
          type: integer
        isActive:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTree'

    # ============================================================
    # NOTIFICATION SCHEMAS
    # ============================================================
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [EMAIL, SMS, PUSH]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ============================================================
    # PAYMENT SCHEMAS
    # ============================================================
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [CASH, TELEBIRR, CHAPA, BANK_TRANSFER]
        status:
          type: string
          enum: [PENDING, PAID, FAILED, REFUNDED]
        transactionId:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ============================================================
    # DISPUTE SCHEMAS
    # ============================================================
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        reason:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, UNDER_REVIEW, RESOLVED, CLOSED]
        resolution:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

# ============================================================
# PATHS
# ============================================================

paths:
  # ============================================================
  # HEALTH
  # ============================================================
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running and healthy
      responses:
        200:
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: Local Service Provider Marketplace API
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: number
                      heapTotal:
                        type: number
                      heapUsed:
                        type: number

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account with email, phone, and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and return access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          expiresIn:
                            type: integer

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate the refresh token and clear session
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Forgot password
      description: Send password reset email to user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password using token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        200:
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change user password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================
  # USERS
  # ============================================================
  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

    put:
      tags:
        - Users
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                bio:
                  type: string
                profileImage:
                  type: string
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users/check-email:
    get:
      tags:
        - Users
      summary: Check if email exists
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        200:
          description: Email check completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          exists:
                            type: boolean

  # ============================================================
  # PROVIDERS
  # ============================================================
  /providers:
    get:
      tags:
        - Providers
      summary: Get providers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: minRating
          in: query
          schema:
            type: number
        - name: isAvailable
          in: query
          schema:
            type: boolean
        - name: isVerified
          in: query
          schema:
            type: boolean
      responses:
        200:
          description: Providers retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Provider'

  /providers/register:
    post:
      tags:
        - Providers
      summary: Register as a provider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - businessName
                - description
                - category
                - locationLat
                - locationLng
                - address
                - city
              properties:
                businessName:
                  type: string
                description:
                  type: string
                category:
                  type: string
                subCategory:
                  type: string
                yearsExperience:
                  type: integer
                hourlyRate:
                  type: number
                locationLat:
                  type: number
                locationLng:
                  type: number
                address:
                  type: string
                city:
                  type: string
                subCity:
                  type: string
                workingHours:
                  type: object
      responses:
        201:
          description: Provider registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Provider'

  /providers/search:
    post:
      tags:
        - Search
        - Providers
      summary: Search providers by location
      description: Search for providers near a location with filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                lng:
                  type: number
                radius:
                  type: number
                  default: 10
                query:
                  type: string
                category:
                  type: string
                subCategory:
                  type: string
                minRating:
                  type: number
                maxPrice:
                  type: number
                isAvailable:
                  type: boolean
                isVerified:
                  type: boolean
                page:
                  type: integer
                limit:
                  type: integer
      responses:
        200:
          description: Search results returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Provider'

  /providers/{id}:
    get:
      tags:
        - Providers
      summary: Get provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Provider details retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Provider'

  /providers/{id}/services:
    get:
      tags:
        - Providers
        - Services
      summary: Get provider services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Services retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Service'

  /providers/services:
    post:
      tags:
        - Providers
        - Services
      summary: Create a service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - priceType
                - price
                - category
              properties:
                title:
                  type: string
                description:
                  type: string
                priceType:
                  type: string
                  enum: [FIXED, HOURLY]
                price:
                  type: number
                discountPrice:
                  type: number
                estimatedDurationMinutes:
                  type: integer
                category:
                  type: string
                subCategory:
                  type: string
                images:
                  type: array
                  items:
                    type: string
      responses:
        201:
          description: Service created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Service'

  /providers/services/{id}:
    get:
      tags:
        - Providers
        - Services
      summary: Get service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Service details retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Service'

    put:
      tags:
        - Providers
        - Services
      summary: Update a service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
