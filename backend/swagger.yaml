                          $ref: '#/components/schemas/Provider'

  /admin/providers/{id}/verify:
    patch:
      tags:
        - Admin
      summary: Verify or reject provider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                notes:
                  type: string
      responses:
        200:
          description: Provider verification updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Provider'

